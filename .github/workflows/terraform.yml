name: Terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_f1_results_channel: ${{ vars.F1_RESULTS_CHANNEL }}
  TF_VAR_github_actions_principal_id: ${{ vars.AZURE_GITHUB_PRINCIPAL_ID }}
  TF_IN_AUTOMATION: true

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Use the image tag that is already running
        run: |
          image=$(az containerapp show -n ca-discord-bot -g rg-discord-bot --query "properties.template.containers[0].image" -o tsv)
          echo "TF_VAR_image_tag=${image##*:}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - run: terraform fmt -check
      - run: terraform init -input=false
      - run: terraform validate

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false | tee plan.txt
        continue-on-error: true

      - name: Comment on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('infra/plan.txt', 'utf8');
            } catch (err) {
              output = 'Plan output was not captured.';
            }
            if (output.length > 60000) {
              output = output.slice(0, 60000) + '\n... truncated';
            }
            output = output.replace(/```/g, "'''");
            const outcome = '${{ steps.plan.outcome }}';
            const fence = '```';
            const body = '#### Terraform plan `' + outcome + '`\n\n' + fence + '\n' + output + '\n' + fence;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail when the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        run: |
          az acr login --name acrdiscordbotcody
          docker build -t acrdiscordbotcody.azurecr.io/discordbot:${{ github.sha }} .
          docker push acrdiscordbotcody.azurecr.io/discordbot:${{ github.sha }}
          echo "TF_VAR_image_tag=${{ github.sha }}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Check and apply
        working-directory: infra
        run: |
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform apply -input=false -auto-approve
